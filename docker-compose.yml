services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [qdrant]
  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    volumes: [".:/app"]
    ports: ["8501:8501"]
    depends_on: [api]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  qdrant_data:
