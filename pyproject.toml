[project]
name = "corporate-multimodal-rag"
version = "1.0.0"
description = "Multi-agent multimodal corrective RAG with hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.5",
  "openai>=1.50",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "qdrant-client>=1.12",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.1",
  "unstructured[all-docs]>=0.15",
  "pymupdf>=1.24",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "sqlalchemy>=2.0",
  "networkx>=3.3",
  "streamlit>=1.39",
  "ragas>=0.2",
  "opentelemetry-api>=1.27",
  "arize-phoenix-otel>=0.6",
  "supabase>=2.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
